      @page {
        size: portrait;

      @media print {
        @page {
          size: portrait !important;
        }
        
        html, body {
          width: 8.5in !important;

        }
      }
    </style>
    <script>
      window.matchMedia('print').addEventListener('change', e => {
        if (e.matches) {
          setTimeout(() => {
            document.querySelectorAll('style, link[rel="stylesheet"]').forEach(s => {
              if (s.textContent && s.textContent.includes('@page')) {
                s.textContent = s.textContent.replace(/landscape/g, 'portrait');
              }
            });
          }, 100);
        }
      });
